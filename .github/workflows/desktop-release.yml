name: Desktop release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  publish-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend/desktop-tauri
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/desktop-tauri/src-tauri
      - run: npm ci
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^desktop-v', ''
          $appVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) { throw "Tag version $tagVersion does not match app version $appVersion" }
      - run: npm test
      - run: npm run tauri build
      - name: Publish signed installer to Railway
        shell: pwsh
        env:
          RAILWAY_RELEASE_URL: ${{ secrets.RAILWAY_RELEASE_URL }}
          RAILWAY_RELEASE_KEY: ${{ secrets.RAILWAY_RELEASE_KEY }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $signature = Get-Item "$($installer.FullName).sig"
          $headers = @{ "X-Desktop-Release-Key" = $env:RAILWAY_RELEASE_KEY }
          $form = @{ version = $version; notes = "Desktop $version"; artifact = $installer; signatureFile = $signature }
          Invoke-RestMethod -Method Post -Uri "$($env:RAILWAY_RELEASE_URL.TrimEnd('/'))/api/desktop-updates/publish" -Headers $headers -Form $form
