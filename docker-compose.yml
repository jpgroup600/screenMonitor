services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: screenmonitor
      POSTGRES_USER: screenmonitor
      POSTGRES_PASSWORD: screenmonitor-dev-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenmonitor -d screenmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SmDb: Host=postgres;Port=5432;Database=screenmonitor;Username=screenmonitor;Password=screenmonitor-dev-password
      JWT__Key: local-development-jwt-signing-key-change-before-production
      FileStorage__UploadPath: /app/Uploads
      ApplyMigrations: "true"
    ports:
      - "5265:8080"
    volumes:
      - screenshot-data:/app/Uploads
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: frontend/dashboard
      args:
        VITE_BACKEND_URL: http://localhost:5265/api
        VITE_IMAGE_URL: http://localhost:5265/Uploads
        VITE_HUB_URL: http://localhost:5265/useractivityhub
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
  screenshot-data:
