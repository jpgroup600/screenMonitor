[package]
name = "screen-monitor-desktop"
version = "2.0.0"
description = "Native employee activity monitor"
edition = "2021"
default-run = "screen-monitor-desktop"

[lib]
name = "screen_monitor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"] }
sha2 = "0.10"
screenshots = "0.8.10"
image = "0.24.9"
tempfile = "3"
thiserror = "2"
notify = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows-service = "0.8"

[dev-dependencies]
httpmock = "0.8.3"
